# Refreshes the figures behind /kerjasama/ once a week and commits the result,
# which is what triggers a Netlify rebuild. The site build itself never calls
# the YouTube API, so if this job fails the numbers go stale but nothing breaks
# — and the page renders `updatedAt`, so stale is visible rather than silent.
name: Refresh YouTube stats

on:
  schedule:
    # 21:00 UTC Sunday — 04:00 Monday in WIB.
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # This job ends with a git push; letting an in-flight run finish is safer
  # than cancelling it partway through a commit/push.
  group: youtube-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The job holds `contents: write` and a secret, and its only slow step is a
    # handful of API calls. A hung fetch has no business burning the 360-minute
    # default with those in hand.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          # Without this the run writes `"handle": null` while a local run
          # writes "@rizafahmi", and the tracked file churns back and forth.
          YOUTUBE_HANDLE: rizafahmi
        run: pnpm run fetch:youtube

      - name: Commit if the numbers moved
        run: |
          # `updatedAt` is stamped on every run, so a plain diff is never quiet
          # and this guard could never fire: every weekly run committed and
          # triggered a Netlify rebuild whether or not a single figure moved.
          # Compare the payload with that one key removed instead.
          strip_timestamp() {
            node -e 'let s="";process.stdin.on("data",d=>{s+=d}).on("end",()=>{const j=JSON.parse(s);delete j.updatedAt;process.stdout.write(JSON.stringify(j))})'
          }
          git show HEAD:src/_data/youtube.json | strip_timestamp > /tmp/youtube-prev.json || : > /tmp/youtube-prev.json
          strip_timestamp < src/_data/youtube.json > /tmp/youtube-next.json
          if cmp -s /tmp/youtube-prev.json /tmp/youtube-next.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/_data/youtube.json
          git commit -m "chore(data): refresh YouTube stats"
          git push
